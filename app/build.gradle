plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}
def googleMapsApiKey = localProperties.getProperty('GOOGLE_MAPS_API_KEY', 'AIzaSyC5yGx_orS8xcunWkezkVD-nmxcysIl0WI')

android {
    namespace 'com.windnsoft.tbus'
    compileSdk 36

    defaultConfig {
        applicationId "com.windnsoft.tbus"
        minSdk 28
        targetSdk 34
        versionCode 13
        versionName '1.13'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file('../key/tbus-release.jks')
            storePassword 'tbus1234!'
            keyAlias 'tbus'
            keyPassword 'tbus1234!'
        }
    }

    buildTypes {
        debug {
            resValue "string", "google_maps_api_key", googleMapsApiKey
        }

        release {
            signingConfig signingConfigs.release
            resValue "string", "google_maps_api_key", googleMapsApiKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

    lint {
        abortOnError = false
        checkReleaseBuilds = false
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildVersionName = variant.versionName
            def buildType = variant.buildType.name
            def resultApkName = "tbus-${buildVersionName}-${buildType}.apk"
            outputFileName = resultApkName
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.gms:play-services-location:21.2.0'
    implementation 'com.google.maps.android:maps-compose:4.4.1'

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'

    // TedPermission
    implementation 'io.github.ParkSangGwon:tedpermission-normal:3.4.2'

    // Timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // ZXing Android Embedded
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    implementation 'androidx.compose.material3:material3'
    implementation 'io.github.kyant0:backdrop:1.0.6'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Landscapist
    implementation 'com.github.skydoves:landscapist-bom:2.4.7'
    implementation 'com.github.skydoves:landscapist-glide:2.4.7'
    implementation 'com.github.skydoves:landscapist-placeholder:2.4.7'
    implementation 'com.github.skydoves:landscapist-animation:2.4.7'

    // Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Paging 3
    implementation 'androidx.paging:paging-runtime-ktx:3.3.2'
    implementation 'androidx.paging:paging-compose:3.3.2'

    // Photo Compose (Zoomable PhotoBox)
    implementation 'io.github.fornewid:photo-compose:1.0.1'

    // Android Image Cropper
    implementation 'com.vanniktech:android-image-cropper:4.6.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
